name: Verify

on:
    push:
    pull_request:

# Chỉ cần đọc mã nguồn; không cấp quyền ghi cho workflow.
permissions:
    contents: read

# Push liên tiếp vào cùng nhánh chỉ cần lần chạy mới nhất.
concurrency:
    group: verify-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run verify
            # Bắt buộc public/tailwind.css khớp với source: thêm class mới mà quên build lại sẽ làm CI đỏ.
            - name: Tailwind CSS đã đồng bộ với source
              run: |
                  npm run assets:build
                  if ! git diff --quiet -- public/tailwind.css; then
                    echo "::error file=public/tailwind.css::Tailwind CSS chưa được build lại. Chạy 'npm run assets:build' rồi commit public/tailwind.css."
                    git --no-pager diff --stat -- public/tailwind.css
                    exit 1
                  fi
