<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho hàng NKiot</title><link rel="stylesheet" href="style.css"><script src="/__deplao/sdk.js"></script><script src="app.js" defer></script></head>
<body><main>
<h1>Kho hàng NKiot</h1><p>Tên, mô tả và ảnh thực tế. Token được cấu hình trong Cài đặt ứng dụng; không nhập vào khung chat.</p>
<form id="search-form">
<label for="query">Tên hoặc mã hàng</label><input id="query" maxlength="200" placeholder="Ví dụ: Omega">
<div class="prices"><div><label for="min-price">Giá từ (đ)</label><input id="min-price" type="number" min="0"></div><div><label for="max-price">Giá đến (đ)</label><input id="max-price" type="number" min="0"></div></div>
<label class="check"><input id="in-stock" type="checkbox" checked> Chỉ còn hàng</label><button type="submit">Tìm sản phẩm</button>
</form>
<p id="status" role="status" aria-live="polite">Đang chờ SDK Deplao…</p>
<section id="products" aria-label="Danh sách sản phẩm"></section>
<nav aria-label="Phân trang"><button id="prev" disabled>Trang trước</button><span id="page">Trang 1</span><button id="next" disabled>Trang sau</button></nav>
<p class="note">Ảnh tải theo yêu cầu, tối đa 5 MB/ảnh theo SDK. Ứng dụng này không tự gửi tin cho khách.</p>
</main></body></html>
